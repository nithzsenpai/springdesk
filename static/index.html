<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sprintdesk</title>
  <link rel="stylesheet" href="/static/style.css">
  <script type="module" src="/static/app.js"></script>
</head>
<body>
  <aside class="sidebar">
    <div class="brand"><span aria-hidden="true">◆</span> Sprintdesk</div>
    <div class="project-label">Projects <button id="new-project" aria-label="New project">+</button></div>
    <nav id="projects" aria-label="Projects"></nav>
    <a class="api-link" href="/docs">API documentation ↗</a>
  </aside>
  <main>
    <div id="notice" role="alert" hidden></div>
    <div id="workspace" aria-busy="true">Loading workspace…</div>
  </main>
  <dialog id="editor" aria-labelledby="editor-title">
    <form id="edit-form">
      <h2 id="editor-title"></h2>
      <label>Title <input name="title" maxlength="120" required></label>
      <label>Description <textarea name="description" maxlength="3000" rows="4"></textarea></label>
      <label data-field="status">Status <select name="status"><option>Backlog</option><option>In progress</option><option>Done</option></select></label>
      <label data-field="priority">Priority <select name="priority"><option>Low</option><option>Medium</option><option>High</option></select></label>
      <label data-field="assignee">Assignee <input name="assignee" maxlength="80" placeholder="Team member name"></label>
      <p id="form-error" role="alert" hidden></p>
      <div class="actions"><button type="button" id="cancel">Cancel</button><button class="primary" type="submit">Save</button></div>
    </form>
  </dialog>
</body>
</html>
